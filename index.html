<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdmitLab - Curating Extracurricular Pathways</title>
    <style>
        :root {
            --bg-color: #FAF6F0;
            --card-bg: #FFFFFF;
            --brand-coral: #F75D59;
            --brand-orange: #FF7B47;
            --brand-yellow: #FFB733;
            --text-dark: #2D2D2D;
            --text-muted: #888888;
            --border-color: #F3E5D8;
            --shadow: 0 10px 25px rgba(247, 93, 89, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            line-height: 1.6;
            padding-bottom: 4rem;
        }

        header {
            background: #FFFFFF;
            padding: 2.5rem 1.5rem 2rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }

        .logo-wrapper {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
        }

        .logo-text {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            display: flex;
        }

        .logo-text .admit {
            color: var(--brand-coral);
        }

        .logo-text .lab {
            color: var(--brand-yellow);
        }

        .tagline {
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 3.5px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-top: 4px;
        }

        .container {
            max-width: 1200px;
            margin: 2.5rem auto 0;
            padding: 0 1.2rem;
        }

        .form-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: var(--shadow);
            margin-bottom: 2.5rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 0.6rem;
            color: var(--brand-coral);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group select {
            padding: 0.9rem 1rem;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            font-size: 1rem;
            color: var(--text-dark);
            background-color: #FFF;
            outline: none;
            transition: all 0.25s ease;
            cursor: pointer;
        }

        .form-group select:focus {
            border-color: var(--brand-orange);
            box-shadow: 0 0 0 3px rgba(255, 123, 71, 0.15);
        }

        .submit-btn {
            margin-top: 2rem;
            width: 100%;
            background: linear-gradient(135deg, var(--brand-coral) 0%, var(--brand-orange) 50%, var(--brand-yellow) 100%);
            color: white;
            border: none;
            padding: 1.1rem;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 123, 71, 0.35);
        }

        .results-container {
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 1.5rem;
            margin-top: 1rem;
        }

        .section-title {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--text-dark);
        }

        .badge-count {
            background: linear-gradient(135deg, var(--brand-coral), var(--brand-orange));
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3.5rem;
        }

        .ec-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.8rem;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .ec-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(247, 93, 89, 0.12);
        }

        .ec-card .tag {
            align-self: flex-start;
            background-color: #FFF3ED;
            color: var(--brand-orange);
            font-size: 0.75rem;
            font-weight: 800;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .ec-card h3 {
            color: var(--text-dark);
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.6rem;
        }

        .ec-card p {
            color: #555555;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        .apply-btn {
            display: inline-block;
            text-align: center;
            background-color: var(--text-dark);
            color: white;
            text-decoration: none;
            padding: 0.75rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background-color 0.2s, transform 0.2s;
        }

        .apply-btn:hover {
            background-color: var(--brand-coral);
        }
    </style>
</head>

        <div class="logo-wrapper">

                    <path d="M15 80 L40 20 L55 20 L30 80 Z" fill="url(#grad-left)"/>
                    <path d="M45 80 L70 20 L85 20 L60 80 Z" fill="url(#grad-right)"/>
                    <path d="M20 62 C 35 55, 55 40, 75 25 L88 38 L68 75 C 50 75, 30 75, 20 62 Z" fill="url(#grad-arrow)"/>
                    <path d="M60 20 L88 20 L88 48 Z" fill="#FF7B47"/>

                        <linearGradient id="grad-left" x1="0" y1="100" x2="0" y2="0" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#F75D59"/>
                            <stop offset="100%" stop-color="#FF7B47"/>
                        </linearGradient>
                        <linearGradient id="grad-arrow" x1="0" y1="100" x2="100" y2="0" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#F75D59"/>
                            <stop offset="60%" stop-color="#FF7B47"/>
                            <stop offset="100%" stop-color="#FFB733"/>
                        </linearGradient>
                        <linearGradient id="grad-right" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#FF7B47"/>
                            <stop offset="100%" stop-color="#FFB733"/>
                        </linearGradient>
                    </defs>
                </svg>
                <div class="logo-text">
                    <span class="admit">Admit</span><span class="lab">Lab</span>
                </div>
            </div>
            <div class="tagline">Curating Extracurricular Pathways</div>
        </div>
    </header>

    <div class="container">
        <div class="form-card">
            <form id="ecForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="age">Grade / Level</label>
                        <select id="age" required>
                            <option value="">Select Level</option>
                            <option value="Middle School">Middle School (Grades 6-8)</option>
                            <option value="High School Fresh/Soph">High School (Grades 9-10)</option>
                            <option value="High School Jun/Sen">High School (Grades 11-12)</option>
                            <option value="Undergraduate">College / Undergraduate</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="interest">Primary Field</label>
                        <select id="interest" required>
                            <option value="">Select Field</option>
                            <option value="Physics">Physics & Astrophysics</option>
                            <option value="Mathematics">Mathematics & Statistics</option>
                            <option value="Engineering">Engineering & Robotics</option>
                            <option value="Biology">Biology & Life Sciences</option>
                            <option value="Business">Business & Entrepreneurship</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="country">Country</label>
                        <select id="country" required>
                            <option value="">Select Country</option>
                            <option value="USA">United States</option>
                            <option value="India">India</option>
                            <option value="UK">United Kingdom</option>
                            <option value="Canada">Canada</option>
                            <option value="Other">Other Country</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="submit-btn">Curate Pathways</button>
            </form>
        </div>

        <div id="results" class="results-container">
            <div class="section-header">
                <h2 class="section-title">National Opportunities</h2>
                <span id="nationalBadge" class="badge-count">10 Found</span>
            </div>
            <div id="nationalCards" class="cards-grid"></div>

            <div class="section-header">
                <h2 class="section-title">Global Pathways</h2>
                <span id="globalBadge" class="badge-count">10 Found</span>
            </div>
            <div id="globalCards" class="cards-grid"></div>
        </div>
    </div>

        document.getElementById('ecForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const interest = document.getElementById('interest').value;
            const country = document.getElementById('country').value;

            const countryNationals = (nationalDatabase[country] && nationalDatabase[country][interest]) 
                ? nationalDatabase[country][interest] 
                : (nationalDatabase['Other'][interest] || []);

            const globalList = globalDatabase[interest] || [];

            const nationalContainer = document.getElementById('nationalCards');
            const globalContainer = document.getElementById('globalCards');

            nationalContainer.innerHTML = '';
            globalContainer.innerHTML = '';

            countryNationals.forEach((item) => {
                nationalContainer.innerHTML += `
                    <div class="ec-card">
                        <div>
                            <span class="tag">National (${country})</span>
                            <h3>${item.title}</h3>
                            <p>${item.desc}</p>
                        </div>
                        <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="apply-btn">View Official Site</a>
                    </div>
                `;
            });

            globalList.forEach((item) => {
                globalContainer.innerHTML += `
                    <div class="ec-card">
                        <div>
                            <span class="tag" style="background-color: #FFF9E6; color: #D68A00;">Global Pathway</span>
                            <h3>${item.title}</h3>
                            <p>${item.desc}</p>
                        </div>
                        <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="apply-btn">View Official Site</a>
                    </div>
                `;
            });

            document.getElementById('nationalBadge').innerText = `${countryNationals.length} Found`;
            document.getElementById('globalBadge').innerText = `${globalList.length} Found`;

            document.getElementById('results').style.display = 'block';
            document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
        });
    </script>
